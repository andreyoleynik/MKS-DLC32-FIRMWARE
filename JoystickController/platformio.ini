[env:esp32-joystick]
platform = espressif32@3.2.0
board = esp32doit-devkit-v1
framework = arduino

; Serial configuration
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-*

; Upload settings
upload_speed = 921600

; Build options
build_flags =
    -DBOARD_HAS_PSRAM
    -DLOG_LEVEL=3

; Dependencies
lib_deps =
    # BluetoothSerial is built-in with ESP32 core

; Memory settings
board_upload.maximum_ram_size = 327680
board_upload.maximum_size = 3145728

; Build output
build_dir = .pio/build/esp32-joystick
lib_dir = lib
src_dir = src
include_dir = include
