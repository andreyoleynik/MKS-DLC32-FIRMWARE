; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = Grbl_Esp32
lib_dir = libraries
data_dir = Grbl_Esp32/data
default_envs = mks_dlc32_v2_1 

extra_configs =
	ini/mks_dlc32.ini

[env]
monitor_speed = 115200

; Нативное окружение для unit-тестов чистой логики (без железа).
; Запуск: pio test -e native   (компилируется только тестируемый модуль)
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<src/SDJobPolicy.cpp>
build_flags = -std=c++17 -I Grbl_Esp32/src
